name: Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  NODE_OPTIONS: --max-old-space-size=512
  RAYON_NUM_THREADS: 2
  GOMAXPROCS: 2
  GOMEMLIMIT: 512MiB

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows private account permissions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Get-Content -Raw -Encoding UTF8 src-tauri/src/infrastructure/provider_accounts/windows.rs
          $script = [regex]::Match($source, '(?s)let script = r#"(.*?)"#;').Groups[1].Value
          if (!$script) { throw 'Private account ACL script is missing' }
          $env:MARXEN_PRIVATE_DIRECTORY = Join-Path $env:RUNNER_TEMP "marxen-acl-fixture [認証]"
          [System.IO.Directory]::CreateDirectory($env:MARXEN_PRIVATE_DIRECTORY) | Out-Null
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -Command $script
          if ($LASTEXITCODE -ne 0) { throw 'Private account ACL verification failed' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux WebKitGTK prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libdbus-1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run bundle:neovim -- --target ${{ matrix.target }}
      - run: npm run verify:neovim -- --target ${{ matrix.target }}
      - run: npm run contracts:check
      - run: npm run ai-contracts:check
      - run: npm run isolation-contracts:check
      - run: npm run vim-settings-contracts:check
      - run: npm run typecheck
      - run: npm run architecture:check
      - run: npm test -- --maxWorkers=2
      - run: npm run test:bundling
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features dev-tools
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --features dev-tools --all-targets -- -D warnings
      - name: Build handwritten Rust documentation without warnings
        run: cargo doc --manifest-path src-tauri/Cargo.toml --locked --features dev-tools --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          MARXEN_E2E_PREBUILT: 1
      - name: Build unsigned native packages with complete Neovim runtime
        run: npm run tauri -- build --target ${{ matrix.target }} --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.prebuilt.conf.json --bundles ${{ matrix.bundles }}
      - name: Package Windows standalone executable and complete Neovim runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $release = 'src-tauri/target/${{ matrix.target }}/release'
          $stage = Join-Path $env:RUNNER_TEMP 'marxen-portable'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "$release/marxen.exe" "$stage/Marxen.exe"
          Copy-Item 'src-tauri/resources/neovim' "$stage/neovim" -Recurse
          $required = @('Marxen.exe', 'neovim/bin/nvim.exe', 'neovim/share/nvim/runtime/doc/help.txt', 'neovim/marxen-bundle.json')
          foreach ($file in $required) {
            if (!(Test-Path "$stage/$file" -PathType Leaf)) { throw "Standalone resource missing: $file" }
          }
          New-Item -ItemType Directory -Path "$release/bundle/portable" -Force | Out-Null
          $archive = "$release/bundle/portable/Marxen_${version}_x64-portable.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, $archive)
          $verify = Join-Path $env:RUNNER_TEMP 'marxen-portable-verify'
          Expand-Archive -Path $archive -DestinationPath $verify -Force
          if ((Get-ChildItem $stage -Recurse -File -Force).Count -ne (Get-ChildItem $verify -Recurse -File -Force).Count) { throw "Standalone archive omitted resources" }
          foreach ($file in $required) {
            if ((Get-FileHash "$stage/$file").Hash -ne (Get-FileHash "$verify/$file").Hash) { throw "Standalone archive mismatch: $file" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: marxen-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.target }}
          path: test-results/
