name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to retry (only when no draft or release exists for it)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Validate exact tag source and main CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/validate-release.mjs --tag "$TAG" --repo "$REPO"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: marxen-*
          path: dist-artifacts
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}
          merge-multiple: false

      - name: Assemble five installers and checksums
        run: |
          set -euo pipefail
          node scripts/assemble-release.mjs \
            --artifacts dist-artifacts \
            --out dist-release \
            --tag "$TAG" \
            --sha "${{ steps.source.outputs.sha }}" \
            --run-id "${{ steps.source.outputs.run-id }}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --target "${{ steps.source.outputs.sha }}" \
            --title "$TAG" \
            --notes-file dist-release/release-notes.md

      - name: Upload installers and checksums to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            dist-release/Marxen_*.exe \
            dist-release/Marxen_*.deb \
            dist-release/Marxen_*.AppImage \
            dist-release/Marxen_*.dmg \
            dist-release/SHA256SUMS

      - name: Verify draft assets then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs --dist dist-release --tag "$TAG" --sha "${{ steps.source.outputs.sha }}"
          gh release edit "$TAG" --draft=false --latest --verify-tag
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets --jq '{ tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, assets: (.assets | length) }'
