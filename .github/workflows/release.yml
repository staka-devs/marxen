name: Release

# Conventional version-tag flow: version change -> main CI -> vX.Y.Z tag -> CD.
# CD reuses the exact tag commit's successful main push Integration artifacts.
# No compile, tests, or installer rebuilds happen here.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to re-publish (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

# One release at a time per version tag. Never cancel a running publish.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      # Pinned to actions/checkout v7.0.1 (2026-10). Reproducible SHA, not a moving tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Push uses refs/tags/vX.Y.Z; dispatch uses the input tag. Both resolve
          # to the exact tag commit below. No tag is created or moved here.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Pinned to actions/setup-node v7.1.0. Helpers use Node builtins only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Validate exact tag source and main CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Exact argv, quoted env inputs, no tokens in logs.
          # Checks strict vX.Y.Z, HEAD equals tag, all version files equal the tag,
          # and one successful main push Integration run for the exact SHA with
          # four successful jobs and four unexpired named artifacts.
          # Uses gh api list-workflow-runs (head_sha/branch/event/status) plus
          # get-run jobs and artifacts endpoints; see docs.github.com REST reference.
          node scripts/validate-release.mjs --tag "$TAG" --repo "$REPO"

      # Pinned to actions/download-artifact v8.0.2. Downloads the validated run only.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: marxen-*
          path: dist-artifacts
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}
          merge-multiple: false

      - name: Assemble five installers and checksums
        run: |
          set -euo pipefail
          # Selects exactly Windows x64 NSIS exe, Linux x64 deb plus AppImage,
          # and macOS arm64 plus x64 dmg files. Rejects missing, duplicate,
          # ambiguous, unexpected, symlink, or path-escape entries. Intermediates
          # such as .app bundles, AppDir content, bundle_dmg.sh, and icons are ignored.
          node scripts/assemble-release.mjs \
            --artifacts dist-artifacts \
            --out dist-release \
            --tag "$TAG" \
            --sha "${{ steps.source.outputs.sha }}" \
            --run-id "${{ steps.source.outputs.run-id }}"

      - name: Reuse or create version draft without overwriting releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets > /tmp/existing.json 2>/tmp/view-err.txt; then
            EXISTING_JSON=/tmp/existing.json TAG="$TAG" node --input-type=module -e "import { readFileSync } from 'node:fs'; import { decideReleaseAction } from './scripts/release-common.mjs'; const existing = JSON.parse(readFileSync(process.env.EXISTING_JSON, 'utf8')); console.log(decideReleaseAction(existing, { tag: process.env.TAG }));" > /tmp/action.txt
          else
            TAG="$TAG" node --input-type=module -e "import { decideReleaseAction } from './scripts/release-common.mjs'; console.log(decideReleaseAction(null, { tag: process.env.TAG }));" > /tmp/action.txt
            rm -f /tmp/existing.json
          fi
          ACTION="$(cat /tmp/action.txt)"
          echo "release action: $ACTION"
          # Guarded recovery only: delete a stale draft (tag itself is kept),
          # then recreate below. Published releases fail inside decideReleaseAction.
          if [ "$ACTION" = "recreate-draft" ]; then
            gh release delete "$TAG" --yes
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --verify-tag aborts when the tag is missing remotely instead of
          # creating it from the wrong commit. --target pins the source SHA.
          # Tags are never retargeted here; no git tag or push runs in CD.
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --target "${{ steps.source.outputs.sha }}" \
            --title "$TAG" \
            --notes-file dist-release/release-notes.md \
            --latest

      - name: Upload installers and checksums to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Exactly six files: five installers plus SHA256SUMS. No --clobber,
          # so an existing asset fails instead of being overwritten.
          gh release upload "$TAG" \
            dist-release/Marxen_*.exe \
            dist-release/Marxen_*.deb \
            dist-release/Marxen_*.AppImage \
            dist-release/Marxen_*.dmg \
            dist-release/SHA256SUMS

      - name: Verify draft assets then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No half release: all assets are checked while still a draft.
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" = "6"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/published.txt
          (cd dist-release && ls Marxen_*.exe Marxen_*.deb Marxen_*.AppImage Marxen_*.dmg SHA256SUMS | sort) > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/published.txt
          (cd dist-release && sha256sum -c SHA256SUMS)
          gh release edit "$TAG" --draft=false --latest --verify-tag
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets --jq '{ tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, assets: (.assets | length) }'
