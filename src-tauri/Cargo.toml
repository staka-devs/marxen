[package]
name = "marxen"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
default-run = "marxen"

[lib]
name = "marxen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "marxen"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "export-contracts"
path = "src/bin/export-contracts.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "=12.0.1"
tauri = { version = "=2.12.1", optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true }
