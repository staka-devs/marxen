[package]
name = "marxen"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
default-run = "marxen"

[lib]
name = "marxen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "marxen"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "export-contracts"
path = "src/bin/export-contracts.rs"

[[bin]]
name = "export-ai-contracts"
path = "src/bin/export-ai-contracts.rs"

[[bin]]
name = "mock-acp-agent"
path = "src/bin/mock-acp-agent.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "=12.0.1"
tauri = { version = "=2.12.1", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
rmpv = { version = "1.3", features = ["with-serde"] }
unicode-width = "0.2"
tempfile = "3"
sha2 = "0.10"
keyring = { version = "=3.6.3", default-features = false }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Security"] }
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
