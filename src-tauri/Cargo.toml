[package]
name = "marxen"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
default-run = "marxen"

[lib]
name = "marxen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "marxen"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "export-contracts"
path = "src/bin/export-contracts.rs"
required-features = ["dev-tools"]

[[bin]]
name = "export-ai-contracts"
path = "src/bin/export-ai-contracts.rs"
required-features = ["dev-tools"]

[[bin]]
name = "mock-acp-agent"
path = "src/bin/mock-acp-agent.rs"
required-features = ["dev-tools"]

[[bin]]
name = "export-isolation-contracts"
path = "src/bin/export-isolation-contracts.rs"
required-features = ["dev-tools"]

[[bin]]
name = "mock-isolation-agent"
path = "src/bin/mock-isolation-agent.rs"
required-features = ["dev-tools"]

[[bin]]
name = "export-vim-settings-contracts"
path = "src/bin/export-vim-settings-contracts.rs"
required-features = ["dev-tools"]

[[bin]]
name = "export-provider-account-contracts"
path = "src/bin/export-provider-account-contracts.rs"
required-features = ["dev-tools"]

[features]
default = ["desktop"]
# Contract generators and independent protocol fixtures never ship in the app.
dev-tools = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:arboard", "dep:clipboard-win", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "=12.0.1"
tauri = { version = "=2.12.1", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"], optional = true }
rmpv = { version = "1.3", features = ["with-serde"] }
unicode-width = "0.2"
regex = "=1.13.1"
tempfile = "3"
sha2 = "0.10"
keyring = { version = "=3.6.3", default-features = false }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "=5.4.1", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Security"] }
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"], optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"], optional = true }
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Keep application stack traces while avoiding full symbols for third-party crates.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

